name: Build & Test

# Runs on every push and pull request against main, across all three
# platforms this project claims to support. This is the first automated
# verification that the Windows (Winsock) socket code path actually
# compiles and passes its tests - previously that code had only ever been
# reviewed by eye, never built on a real Windows environment.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # Without an explicit timeout, a hung process (a test that blocks
    # forever instead of failing) eats GitHub's default 6-hour job limit
    # before anything reports back - this happened once already (see the
    # test_http_client.cpp fix for the actual root cause). This bound
    # exists so ANY future hang, from this or any other cause, fails fast
    # instead of silently burning hours of CI minutes.
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config Release
